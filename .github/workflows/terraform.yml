name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - "lambda/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "lambda/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request a short-lived OIDC token for AWS
  contents: read

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC claims (temporary)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`sub: ${claims.sub}`);
            core.info(`aud: ${claims.aud}`);
            core.info(`iss: ${claims.iss}`);

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::163649804794:role/github-actions-terraform
          aws-region: ap-south-1
          role-skip-session-tagging: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan
